[project]
name = "colab-monitor"
dynamic = ["version"]
description = "A local web dashboard for watching the Colab sessions you run with the colab CLI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/colab_monitor/static/fonts/OFL.txt"]
authors = [{ name = "Duc Hieu Ho" }]
requires-python = ">=3.12"
dependencies = ["google-colab-cli>=0.7.5"]
keywords = ["colab", "dashboard", "monitoring", "gpu", "jupyter", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/hohieuai/colab-monitor"
Issues = "https://github.com/hohieuai/colab-monitor/issues"
Changelog = "https://github.com/hohieuai/colab-monitor/blob/main/CHANGELOG.md"

[project.scripts]
colab-monitor = "colab_monitor.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/colab_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/colab_monitor"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.55", "pillow>=11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser tests (need Chrome or Playwright Chromium)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # modern syntax
    "BLE",      # no blind except without a reason
    "PIE",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
