name: CI

# One Linux job on the oldest supported Python. Changes reach main through pull requests,
# so pushes to main don't run it again; run it by hand from the Actions tab when needed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # Browser tests use the runner's Chrome.
      - run: uv run pytest -ra
      # Every request path up to a bound against /api/log; see verification/log_access/README.md.
      - name: Verify that /api/log serves only allowed files
        run: uv run python verification/log_access/check.py
